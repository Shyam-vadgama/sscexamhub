name: Fetch Education News

on:
  schedule:
    # Run every hour at :00 (UTC). GitHub Actions cron uses UTC.
    # Previous schedule was every 6 hours — changed to hourly for fresh news.
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Prevent duplicate or overlapping runs.
# If a new run starts while one is already in progress, the in-progress
# run is cancelled and the new one takes over (latest wins).
concurrency:
  group: fetch-news
  cancel-in-progress: true

# Minimal required permissions — principle of least privilege.
permissions:
  contents: read

jobs:
  fetch-news:
    name: Fetch & Clean Education News
    runs-on: ubuntu-latest
    environment: Production

    # Abort the entire job if it runs longer than 10 minutes.
    # Normal runs complete in under 60 seconds; this catches hangs.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Validate required secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set"
            exit 1
          fi
          echo "All required secrets are present."
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch news and clean up old records
        id: fetch
        run: npx ts-node --project tsconfig.scripts.json scripts/fetch-news.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Report failure
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::News fetch script failed. Check logs above for details."
          echo "::notice::The Supabase pg_cron job (delete-old-news) will continue"
          echo "::notice::running hourly as a fallback for database cleanup."
